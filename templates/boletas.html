<!DOCTYPE html>
<html>
<head>
    <title>Boletas</title>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

<h1>💳 Boletas</h1>

<div class="nav">
    <a href="/"><button>🏠 Volver</button></a>
</div>

<div class="container">

    {% for b in boletas %}
        <div class="card">
            👤 {{b['nombre']}}<br>
            💰 Total: ${{b['total']}}<br>
            💵 Pagado: ${{b['pagado']}}<br>
            📌 Estado: {{b['estado']}}
        </div>
    {% endfor %}

</div>

</body>
</html>
