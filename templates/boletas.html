<!DOCTYPE html>
<html>
<head>
    <title>Boletas</title>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

<h1>💳 Boletas (Ventas)</h1>

<div class="nav">
    <a href="/"><button>🏠 Volver</button></a>
    <a href="/dashboard"><button>📊 Dashboard</button></a>
</div>

<div class="container">

    {% for b in boletas %}

        <div class="card">

            <h3>🧾 Venta #{{b['id']}}</h3>

            <p>💰 Total: ${{b['total']}}</p>

            <p>📅 Fecha: {{b['fecha']}}</p>

        </div>

    {% endfor %}

</div>

</body>
</html>
