<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sistema de Gestión</title>
    <!-- Google Fonts para que se vea más profesional -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --accent: #3b82f6;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --success: #22c55e;
            --danger: #ef4444;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body { 
            font-family: 'Inter', sans-serif; 
            background: var(--bg); 
            color: var(--text); 
            margin: 0; 
            padding: 0;
            line-height: 1.5;
        }

        /* Menú Inferior Estilo App Movil */
        nav { 
            background: var(--card); 
            padding: 10px 5px; 
            display: flex; 
            justify-content: space-around; 
            position: fixed; 
            bottom: 0; 
            width: 100%; 
            z-index: 1000; 
            border-top: 1px solid #334155;
            box-shadow: 0 -4px 10px rgba(0,0,0,0.3);
        }

        nav a { 
            color: var(--text-muted); 
            text-decoration: none; 
            font-size: 11px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            gap: 4px;
            transition: 0.3s;
        }

        nav a.active, nav a:hover { color: var(--accent); }
        
        .icon { font-size: 20px; }

        /* Contenedor Principal */
        .container { 
            max-width: 100%; 
            margin: 0 auto; 
            padding: 15px 15px 100px 15px; /* Espacio abajo para que el menú no tape nada */
        }

        h1 { font-size: 24px; font-weight: 700; margin-bottom: 20px; color: var(--text); }

        /* Tarjetas Estilizadas */
        .card { 
            background: var(--card); 
            padding: 18px; 
            border-radius: 16px; 
            border: 1px solid rgba(255,255,255,0.05); 
            margin-bottom: 15px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        /* Inputs y Botones "Fat Finger" (para dedos grandes) */
        input, select, button { 
            width: 100%;
            padding: 14px; 
            border-radius: 12px; 
            border: 1px solid #334155; 
            background: #0f172a; 
            color: white; 
            font-size: 16px; /* Evita que el iPhone haga zoom automático */
            margin-bottom: 10px;
        }

        button { 
            background: var(--accent); 
            font-weight: 600; 
            border: none; 
            cursor: pointer;
            transition: transform 0.1s;
        }

        button:active { transform: scale(0.98); }

        /* Tablas adaptables */
        .table-container { overflow-x: auto; border-radius: 12px; }
        table { width: 100%; border-collapse: collapse; min-width: 500px; }
        th { background: #334155; color: var(--text-muted); padding: 12px; text-align: left; font-size: 13px; }
        td { padding: 12px; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 14px; }

        /* Etiquetas de estado */
        .badge { padding: 4px 8px; border-radius: 6px; font-size: 12px; font-weight: 600; }
        .pagado { background: rgba(34, 197, 94, 0.2); color: #4ade80; }
        .fiado { background: rgba(239, 68, 68, 0.2); color: #f87171; }

    </style>
</head>
<body>
    <div class="container">
        {% block content %}{% endblock %}
    </div>

    <nav>
        <a href="/dashboard"><span class="icon">📊</span>Panel</a>
        <a href="/"><span class="icon">📦</span>Stock</a>
        <a href="/vender"><span class="icon">🛒</span>Vender</a>
        <a href="/compras"><span class="icon">🏭</span>Compras</a>
        <a href="/boletas"><span class="icon">📑</span>Cobros</a>
    </nav>
</body>
</html>
