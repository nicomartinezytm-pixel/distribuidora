<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Distribuidora</title>
    <style>
        :root { 
            --bg: #0f172a; 
            --card: #1e293b; 
            --accent: #3b82f6; 
            --text: #f8fafc; 
        }

        body { 
            font-family: sans-serif; 
            background: var(--bg); 
            color: var(--text); 
            margin: 0; 
            /* Aumentamos el padding del body para que el contenido no quede atrás del menú */
            padding-bottom: calc(90px + env(safe-area-inset-bottom)); 
        }

        .container { padding: 15px; }

        .card { 
            background: var(--card); 
            padding: 15px; 
            border-radius: 12px; 
            margin-bottom: 15px; 
            border: 1px solid #334155;
        }

        /* --- EL ARREGLO PARA LOS BOTONES DEL CELULAR --- */
        nav { 
            background: var(--card); 
            position: fixed; 
            bottom: 0; 
            width: 100%; 
            display: flex; 
            justify-content: space-around; 
            /* Agregamos espacio extra abajo basado en el sistema del celular */
            padding-top: 12px;
            padding-bottom: calc(12px + env(safe-area-inset-bottom)); 
            border-top: 1px solid #334155; 
            z-index: 1000;
            box-shadow: 0 -5px 15px rgba(0,0,0,0.3);
        }

        nav a { 
            color: #94a3b8; 
            text-decoration: none; 
            font-size: 12px; 
            text-align: center; 
            flex: 1; /* Esto hace que el área de toque sea más ancha */
        }

        input, button, select { 
            width: 100%; 
            padding: 14px; 
            border-radius: 10px; 
            border: 1px solid #334155; 
            background: #0f172a; 
            color: white; 
            margin-bottom: 12px; 
            font-size: 16px; 
        }

        button { background: var(--accent); font-weight: bold; border: none; }
        
        .icon { font-size: 24px; margin-bottom: 4px; display: block; }
    </style>
</head>
<body>
    <div class="container">
        {% block content %}{% endblock %}
    </div>

    <nav>
        <a href="/dashboard"><span class="icon">📊</span>Panel</a>
        <a href="/"><span class="icon">📦</span>Stock</a>
        <a href="/vender"><span class="icon">🛒</span>Vender</a>
        <a href="/compras"><span class="icon">🏭</span>Compras</a>
        <a href="/boletas"><span class="icon">📑</span>Cobros</a>
    </nav>
</body>
</html>
