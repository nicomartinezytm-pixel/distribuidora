<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Distribuidora</title>
    <style>
        :root { --bg: #0f172a; --card: #1e293b; --accent: #3b82f6; --text: #f8fafc; }
        body { font-family: sans-serif; background: var(--bg); color: var(--text); margin: 0; padding-bottom: 80px; }
        .container { padding: 15px; }
        .card { background: var(--card); padding: 15px; border-radius: 12px; margin-bottom: 15px; }
        nav { background: var(--card); position: fixed; bottom: 0; width: 100%; display: flex; justify-content: space-around; padding: 12px 0; border-top: 1px solid #334155; }
        nav a { color: #94a3b8; text-decoration: none; font-size: 11px; text-align: center; }
        input, button, select { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: white; margin-bottom: 10px; font-size: 16px; }
        button { background: var(--accent); font-weight: bold; border: none; }
    </style>
</head>
<body>
    <div class="container">{% block content %}{% endblock %}</div>
    <nav>
        <a href="/dashboard"><span>📊</span><br>Panel</a>
        <a href="/"><span>📦</span><br>Stock</a>
        <a href="/vender"><span>🛒</span><br>Vender</a>
        <a href="/compras"><span>🏭</span><br>Compras</a>
        <a href="/boletas"><span>📑</span><br>Cobros</a>
    </nav>
</body>
</html>
