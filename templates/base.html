<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Gestión Móvil</title>
    <style>
        :root { 
            --bg: #0f172a; --card: #1e293b; --accent: #3b82f6; 
            --text: #f8fafc; --muted: #94a3b8; --success: #22c55e;
        }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg); color: var(--text); margin: 0;
            /* Evita que el contenido choque arriba y abajo */
            padding-top: env(safe-area-inset-top);
            padding-bottom: calc(80px + env(safe-area-inset-bottom));
        }

        .container { padding: 15px; }

        /* Tarjetas de Inventario */
        .item-card {
            background: var(--card);
            padding: 15px;
            border-radius: 16px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid rgba(255,255,255,0.05);
        }

        /* Modal Adaptado */
        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); z-index: 2000; 
            padding-top: env(safe-area-inset-top);
        }
        .modal-content {
            background: var(--card); margin: 20px; padding: 25px;
            border-radius: 20px; position: relative;
        }

        input, select, button { 
            width: 100%; padding: 15px; border-radius: 12px; 
            border: 1px solid #334155; background: #0f172a; 
            color: white; font-size: 16px; margin-bottom: 12px;
        }

        button { background: var(--accent); border: none; font-weight: 700; }
        .btn-close { background: #475569; margin-top: 5px; }

        nav { 
            background: rgba(30, 41, 59, 0.95); backdrop-filter: blur(10px);
            position: fixed; bottom: 0; width: 100%; display: flex; 
            justify-content: space-around; padding-top: 15px;
            padding-bottom: calc(15px + env(safe-area-inset-bottom)); 
            border-top: 1px solid #334155; z-index: 1000;
        }
        nav a { color: var(--muted); text-decoration: none; font-size: 11px; text-align: center; flex: 1; }
        .icon { font-size: 24px; display: block; margin-bottom: 4px; }
    </style>
</head>
<body>
    <div class="container">{% block content %}{% endblock %}</div>
    <nav>
        <a href="/dashboard"><span class="icon">📊</span>Panel</a>
        <a href="/"><span class="icon">📦</span>Stock</a>
        <a href="/vender"><span class="icon">🛒</span>Vender</a>
        <a href="/compras"><span class="icon">🏭</span>Compras</a>
        <a href="/boletas"><span class="icon">📑</span>Cobros</a>
    </nav>
</body>
</html>
