<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Distribuidora App</title>
    <style>
        body { font-family: sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding-bottom: 50px; }
        nav { background: #1e293b; padding: 15px; display: flex; gap: 15px; justify-content: center; position: sticky; top: 0; z-index: 100; }
        nav a { color: #94a3b8; text-decoration: none; font-weight: bold; font-size: 14px; }
        nav a:hover { color: white; }
        .container { max-width: 1000px; margin: 20px auto; padding: 0 20px; }
        .card { background: #1e293b; padding: 20px; border-radius: 12px; border: 1px solid #334155; margin-bottom: 20px; }
        input, select, button { padding: 10px; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: white; }
        button { cursor: pointer; border: none; }
    </style>
</head>
<body>
    <nav>
        <a href="/dashboard">📊 Panel</a>
        <a href="/">📦 Inventario</a>
        <a href="/vender">🛒 Vender</a>
        <a href="/compras">🏭 Compras</a>
        <a href="/boletas">📑 Cobros</a>
        <a href="/clientes">👥 Clientes</a>
    </nav>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
