<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Sistema Stock</title>
    <style>
        :root { --bg: #0f172a; --card: #1e293b; --accent: #3b82f6; --text: #f8fafc; }
        body { 
            font-family: sans-serif; background: var(--bg); color: var(--text); margin: 0;
            padding-top: env(safe-area-inset-top);
            padding-bottom: calc(80px + env(safe-area-inset-bottom));
        }
        .container { padding: 15px; }
        .card { background: var(--card); padding: 15px; border-radius: 12px; margin-bottom: 15px; }
        input, select, button { 
            width: 100%; padding: 16px; border-radius: 10px; border: 1px solid #334155; 
            background: #0f172a; color: white; margin-bottom: 10px; font-size: 16px; box-sizing: border-box;
        }
        button { background: var(--accent); font-weight: bold; border: none; cursor: pointer; }
        nav { 
            background: var(--card); position: fixed; bottom: 0; width: 100%; display: flex; 
            padding-bottom: env(safe-area-inset-bottom); border-top: 1px solid #334155;
        }
        nav a { color: #94a3b8; text-decoration: none; font-size: 12px; text-align: center; flex: 1; padding: 15px 0; }
        .badge { padding: 4px 8px; border-radius: 6px; font-size: 12px; font-weight: bold; }
        .fiado { background: #ef4444; }
        .pagado { background: #22c55e; }
    </style>
</head>
<body>
    <div class="container">{% block content %}{% endblock %}</div>
    <nav>
        <a href="/dashboard">📊 Panel</a>
        <a href="/">📦 Stock</a>
        <a href="/vender">🛒 Vender</a>
        <a href="/compras">🏭 Compras</a>
        <a href="/boletas">📑 Cobros</a>
    </nav>
</body>
</html>
