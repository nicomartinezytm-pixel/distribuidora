<!DOCTYPE html>
<html>
<head>
<title>Distribuidora Pro</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<style>
body{
    margin:0;
    font-family:system-ui;
    background:#f4f6f9;
    padding-bottom:85px;
}

.container{
    padding:15px;
    max-width:900px;
    margin:auto;
}

h1{
    text-align:center;
    font-size:22px;
}

.card{
    background:white;
    padding:14px;
    margin:12px 0;
    border-radius:16px;
    box-shadow:0 4px 15px rgba(0,0,0,0.06);
}

input{
    width:100%;
    padding:10px;
    margin:6px 0;
    border-radius:10px;
    border:1px solid #ddd;
}

button{
    width:100%;
    padding:10px;
    border:none;
    border-radius:10px;
    background:#2563eb;
    color:white;
}

button.red{
    background:#ef4444;
}

/* 🔥 FIX MOBILE REAL */
.bottom-nav{
    position:fixed;
    bottom:0;
    width:100%;
    height:65px;
    background:#111827;
    display:flex;
    justify-content:space-around;
    align-items:center;
    padding-bottom:env(safe-area-inset-bottom);
}

.bottom-nav a{
    color:white;
    text-decoration:none;
    font-size:12px;
    text-align:center;
}
</style>

</head>

<body>

{% block content %}{% endblock %}

<div class="bottom-nav">
    <a href="/">🏠<br>Inicio</a>
    <a href="/vender">💰<br>Ventas</a>
    <a href="/dashboard">📊<br>Stats</a>
    <a href="/clientes">👥<br>Clientes</a>
</div>

</body>
</html>
