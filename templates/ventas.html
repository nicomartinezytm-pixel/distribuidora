<!DOCTYPE html>
<html>
<head>
    <title>Ventas PRO</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            margin: 0;
            font-family: Arial;
            background: #e9ecef;
            padding-bottom: 100px;
        }

        h1 { text-align: center; }

        .container { padding: 12px; }

        .card {
            background: white;
            padding: 15px;
            margin-bottom: 12px;
            border-radius: 14px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 6px 0;
        }

        .producto {
            display: flex;
            justify-content: space-between;
            padding: 10px;
            background: #f8f9fa;
            margin-bottom: 8px;
            border-radius: 10px;
        }

        button {
            background: #198754;
            color: white;
            border: none;
            padding: 8px 10px;
            border-radius: 8px;
        }

        .total {
            background: #111;
            color: white;
            padding: 10px;
            text-align: center;
            font-size: 18px;
            border-radius: 10px;
        }
    </style>
</head>

<body>

<a href="/">⬅ Volver</a>

<h1>🛒 Ventas PRO</h1>

<div class="container">

<!-- CLIENTE -->
<div class="card">
    <h3>Cliente</h3>
    <input id="nombre" placeholder="Nombre">
    <input id="telefono" placeholder="Teléfono">
    <input id="direccion" placeholder="Dirección">
</div>

<!-- PRODUCTOS -->
<div class="card">
    <h3>Productos</h3>
    <div id="productos"></div>
</div>

<!-- CARRITO -->
<div class="card">
    <h3>Carrito</h3>
    <div id="carrito"></div>

    <div class="total">
        TOTAL: $<span id="total">0</span>
    </div>

    <button onclick="finalizar()" style="width:100%; margin-top:10px;">
        FINALIZAR VENTA
    </button>
</div>

</div>

<script>

let carrito = [];

// 🔥 ahora viene desde Flask correctamente
fetch("/productos_json")
.then(r => r.json())
.then(data => {

    let cont = document.getElementById("productos");

    data.forEach(p => {
        cont.innerHTML += `
        <div class="producto">
            <div>
                <b>${p.nombre}</b><br>
                $${p.precio}
            </div>

            <button onclick="agregar(${p.id}, '${p.nombre}', ${p.precio})">
                +
            </button>
        </div>
        `;
    });

});

function agregar(id, nombre, precio) {

    let item = carrito.find(p => p.id === id);

    if (item) {
        item.cantidad++;
    } else {
        carrito.push({id, nombre, precio, cantidad: 1});
    }

    render();
}

function render() {

    let cont = document.getElementById("carrito");
    cont.innerHTML = "";

    let total = 0;

    carrito.forEach((p, i) => {

        let subtotal = p.precio * p.cantidad;
        total += subtotal;

        cont.innerHTML += `
        <div>
            ${p.nombre} x${p.cantidad} - $${subtotal}
            <button onclick="quitar(${i})">X</button>
        </div>
        `;
    });

    document.getElementById("total").innerText = total.toFixed(2);
}

function quitar(i) {
    carrito.splice(i, 1);
    render();
}

function finalizar() {

    let data = {
        cliente: {
            nombre: nombre.value,
            telefono: telefono.value,
            direccion: direccion.value
        },
        carrito: carrito
    };

    fetch("/finalizar_venta", {
        method: "POST",
        headers: {
            "Content-Type": "application/x-www-form-urlencoded"
        },
        body: "data=" + encodeURIComponent(JSON.stringify(data))
    })
    .then(r => r.json())
    .then(res => {
        alert("Venta realizada ✔");
        location.reload();
    });

}

</script>

</body>
</html>
