<!DOCTYPE html>
<html>
<head>
    <title>Ventas</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="/static/style.css">

    <style>
        body {
            margin: 0;
            font-family: Arial;
            background: #f2f2f2;
            padding-bottom: 80px;
        }

        h1 {
            text-align: center;
            margin-top: 20px;
        }

        .container {
            padding: 15px;
        }

        .card {
            background: white;
            padding: 15px;
            margin: 10px 0;
            border-radius: 10px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }

        input, select {
            width: 100%;
            padding: 10px;
            margin: 5px 0;
        }

        button {
            padding: 10px;
            width: 100%;
            background: #111;
            color: white;
            border: none;
            margin-top: 10px;
        }

        /* BOTÓN VOLVER */
        .back-btn {
            position: fixed;
            top: 15px;
            left: 15px;
            background: #111;
            color: white;
            padding: 10px 12px;
            border-radius: 50%;
            text-decoration: none;
            z-index: 9999;
        }

        /* BARRA INFERIOR */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 65px;
            background: #111;
            display: flex;
            justify-content: space-around;
            align-items: center;
        }

        .nav-item {
            color: white;
            text-decoration: none;
            text-align: center;
            font-size: 12px;
            flex: 1;
        }

        .nav-item span {
            display: block;
            font-size: 11px;
        }
    </style>
</head>

<body>

<!-- VOLVER -->
<a href="/" class="back-btn">←</a>

<h1>💰 Ventas</h1>

<div class="container">

    <div class="card">
        <h2>Nueva venta</h2>

        <form method="POST" action="/finalizar_venta">

            <label>Cliente:</label>
            <select name="cliente" required>
                {% for c in clientes %}
                    <option value="{{ c[0] }}">
                        {{ c[1] }} - {{ c[2] }}
                    </option>
                {% endfor %}
            </select>

            <label>Total:</label>
            <input name="total" type="number" step="0.01" required>

            <!-- carrito oculto (lo usas con JS si ya lo tenías) -->
            <input type="hidden" name="carrito" value="[]">

            <button type="submit">Finalizar venta</button>
        </form>
    </div>

    <div class="card">
        <h2>Productos disponibles</h2>

        {% for p in productos %}
            <p>📦 {{ p[1] }} - ${{ p[2] }} (Stock: {{ p[3] }})</p>
        {% endfor %}
    </div>

</div>

<!-- BARRA INFERIOR -->
<div class="bottom-nav">

    <a href="/" class="nav-item">
        🏠<span>Inicio</span>
    </a>

    <a href="/vender" class="nav-item">
        💰<span>Vender</span>
    </a>

    <a href="/dashboard" class="nav-item">
        📊<span>Stats</span>
    </a>

</div>

</body>
</html>
