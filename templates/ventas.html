{% extends "base.html" %}
{% block content %}

<div class="container">

<h1>🧾 Ventas</h1>

<!-- ================= CLIENTE ================= -->
<div class="card">
<h3>👤 Cliente</h3>

<input id="nombre" placeholder="Nombre del cliente">
<input id="direccion" placeholder="Dirección">

</div>

<!-- ================= PRODUCTOS ================= -->
<div class="card">
<h3>📦 Productos disponibles</h3>

<div id="productos"></div>

</div>

<!-- ================= CARRITO ================= -->
<div class="card">
<h3>🛒 Carrito de venta</h3>

<div id="carrito"></div>

<h2>Total: $<span id="total">0</span></h2>

<button onclick="finalizar()">FINALIZAR VENTA</button>

</div>

</div>

<script>

let carrito = [];

// CARGAR PRODUCTOS
fetch("/productos_json")
.then(r => r.json())
.then(data => {

    let div = document.getElementById("productos");

    data.forEach(p => {

        div.innerHTML += `
        <div class="card">
            <b>${p.nombre}</b><br>
            💰 $${p.precio}<br>

            <button onclick="agregar(${p.id}, '${p.nombre}', ${p.precio})">
                Agregar
            </button>
        </div>
        `;
    });

});

function agregar(id, nombre, precio){

    let item = carrito.find(p => p.id === id);

    if(item){
        item.cantidad++;
    } else {
        carrito.push({
            id:id,
            nombre:nombre,
            precio:precio,
            cantidad:1
        });
    }

    render();
}

function render(){

    let div = document.getElementById("carrito");
    div.innerHTML = "";

    let total = 0;

    carrito.forEach((p, i) => {

        let subtotal = p.precio * p.cantidad;
        total += subtotal;

        div.innerHTML += `
        <div class="card">
            ${p.nombre} x${p.cantidad} = $${subtotal}
            <button class="red" onclick="quitar(${i})">Eliminar</button>
        </div>
        `;
    });

    document.getElementById("total").innerText = total.toFixed(2);
}

function quitar(i){
    carrito.splice(i,1);
    render();
}

function finalizar(){

    let data = {
        cliente:{
            nombre: document.getElementById("nombre").value,
            direccion: document.getElementById("direccion").value
        },
        carrito: carrito
    };

    fetch("/finalizar_venta",{
        method:"POST",
        headers:{
            "Content-Type":"application/x-www-form-urlencoded"
        },
        body:"data="+encodeURIComponent(JSON.stringify(data))
    })

    .then(r=>r.json())
    .then(res=>{
        alert("Venta realizada ✔");
        location.reload();
    });

}

</script>

{% endblock %}
