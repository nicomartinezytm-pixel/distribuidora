{% extends "base.html" %}
{% block content %}

<style>
    .search-box { position: relative; margin-bottom: 20px; }
    .results { position: absolute; background: #1e293b; width: 100%; border-radius: 8px; z-index: 10; border: 1px solid #334155; max-height: 200px; overflow-y: auto; }
    .item-res { padding: 10px; cursor: pointer; border-bottom: 1px solid #334155; }
    .item-res:hover { background: #334155; }
    .cart-item { display: flex; justify-content: space-between; align-items: center; background: rgba(255,255,255,0.05); padding: 10px; border-radius: 8px; margin-bottom: 10px; }
    .tag-oferta-mini { font-size: 10px; background: #f59e0b; color: black; padding: 2px 5px; border-radius: 4px; margin-left: 5px; }
</style>

<h1>🛒 Nueva Venta</h1>

<div class="card">
    <input type="text" id="clienteNom" placeholder="Nombre del Cliente" required>
    <input type="text" id="clienteDir" placeholder="Dirección">
</div>

<div class="search-box">
    <input type="text" id="buscador" placeholder="🔍 Buscar producto por nombre..." onkeyup="buscar()">
    <div id="listaResultados" class="results"></div>
</div>

<div id="carrito" style="margin-top: 20px;">
    <h3>Detalle del Pedido</h3>
    <div id="itemsCarrito"></div>
    <hr style="opacity: 0.1;">
    <h2 style="text-align: right;">Total: $<span id="totalVenta">0</span></h2>
    
    <button onclick="finalizarVenta()" style="background: #22c55e; width: 100%; font-size: 18px; margin-top: 10px;">
        🚀 Confirmar Pedido (Fiado)
    </button>
</div>

<script>
let productos = [];
let carrito = [];

async function cargarProds() {
    const res = await fetch('/productos_json');
    productos = await res.json();
}

function buscar() {
    const term = document.getElementById('buscador').value.toLowerCase();
    const resDiv = document.getElementById('listaResultados');
    resDiv.innerHTML = '';
    if(!term) return;

    const filtrados = productos.filter(p => p.nombre.toLowerCase().includes(term));
    filtrados.forEach(p => {
        const div = document.createElement('div');
        div.className = 'item-res';
        div.innerHTML = `<b>${p.nombre}</b> - $${p.precio} <small>(${p.unidad})</small>`;
        div.onclick = () => agregarAlCarrito(p);
        resDiv.appendChild(div);
    });
}

function agregarAlCarrito(p) {
    const existe = carrito.find(item => item.id === p.id);
    if(existe) {
        existe.cantidad++;
    } else {
        carrito.push({...p, cantidad: 1});
    }
    document.getElementById('buscador').value = '';
    document.getElementById('listaResultados').innerHTML = '';
    renderCarrito();
}

function cambiarCant(id, delta) {
    const item = carrito.find(i => i.id === id);
    if(item) {
        item.cantidad += delta;
        if(item.cantidad <= 0) carrito = carrito.filter(i => i.id !== id);
    }
    renderCarrito();
}

function renderCarrito() {
    const div = document.getElementById('itemsCarrito');
    div.innerHTML = '';
    let total = 0;
    carrito.forEach(item => {
        const sub = item.precio * item.cantidad;
        total += sub;
        div.innerHTML += `
            <div class="cart-item">
                <div>
                    <b>${item.nombre}</b> <br>
                    <small>$${item.precio} x ${item.cantidad}</small>
                    ${item.oferta ? `<span class="tag-oferta-mini">${item.oferta}</span>` : ''}
                </div>
                <div>
                    <button onclick="cambiarCant(${item.id}, -1)">-</button>
                    <span style="margin: 0 10px;">${item.cantidad}</span>
                    <button onclick="cambiarCant(${item.id}, 1)">+</button>
                    <b style="margin-left:15px;">$${sub}</b>
                </div>
            </div>`;
    });
    document.getElementById('totalVenta').innerText = total;
}

async function finalizarVenta() {
    const cliente = {
        nombre: document.getElementById('clienteNom').value,
        direccion: document.getElementById('clienteDir').value
    };
    if(!cliente.nombre || carrito.length === 0) return alert("Faltan datos");

    const formData = new FormData();
    formData.append('data', JSON.stringify({cliente, carrito}));

    const res = await fetch('/finalizar_venta', { method: 'POST', body: formData });
    if(res.ok) {
        alert("Pedido cargado con éxito");
        window.location.href = "/boletas";
    }
}
cargarProds();
</script>

{% endblock %}
