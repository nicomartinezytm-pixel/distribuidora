<!DOCTYPE html>
<html>
<head>
    <title>Ventas PRO</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            margin: 0;
            font-family: Arial;
            background: #e9ecef;
            padding-bottom: 100px;
            color: #111;
        }

        h1 {
            text-align: center;
            margin: 15px 0;
        }

        .container {
            padding: 12px;
        }

        .card {
            background: white;
            padding: 15px;
            margin-bottom: 12px;
            border-radius: 14px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 6px 0;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        .productos {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .producto {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            border-radius: 10px;
            background: #f8f9fa;
            border: 1px solid #ddd;
        }

        .producto b {
            color: #111;
        }

        .producto button {
            background: #198754;
            border: none;
            color: white;
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .producto button:active {
            transform: scale(0.95);
        }

        .carrito-item {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
            border-bottom: 1px solid #eee;
        }

        .carrito-item button {
            background: #dc3545;
            color: white;
            border: none;
            padding: 4px 8px;
            border-radius: 6px;
        }

        .total-box {
            margin-top: 10px;
            padding: 12px;
            background: #212529;
            color: white;
            text-align: center;
            font-size: 20px;
            border-radius: 10px;
        }

        .finalizar {
            width: 100%;
            padding: 12px;
            background: #0d6efd;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            margin-top: 10px;
        }

        .back {
            position: fixed;
            top: 15px;
            left: 15px;
            background: #111;
            color: white;
            padding: 10px;
            border-radius: 50%;
            text-decoration: none;
        }

    </style>
</head>

<body>

<a href="/" class="back">←</a>

<h1>🛒 Ventas PRO</h1>

<div class="container">

<!-- CLIENTE -->
<div class="card">
    <h3>Cliente</h3>
    <input id="nombre" placeholder="Nombre">
    <input id="telefono" placeholder="Teléfono">
    <input id="direccion" placeholder="Dirección">
</div>

<!-- PRODUCTOS -->
<div class="card">
    <h3>Productos</h3>
    <div class="productos" id="productos"></div>
</div>

<!-- CARRITO -->
<div class="card">
    <h3>Carrito</h3>
    <div id="carrito"></div>

    <div class="total-box">
        TOTAL: $<span id="total">0</span>
    </div>

    <button class="finalizar" onclick="finalizar()">
        FINALIZAR VENTA
    </button>
</div>

</div>

<script>

let carrito = [];

// cargar productos
fetch("/productos_json")
.then(r => r.json())
.then(data => {

    let cont = document.getElementById("productos");

    data.forEach(p => {

        cont.innerHTML += `
        <div class="producto">
            <div>
                <b>${p.nombre}</b><br>
                <small>$${p.precio}</small>
            </div>

            <button onclick="agregar(${p.id}, '${p.nombre}', ${p.precio})">
                AGREGAR
            </button>
        </div>
        `;
    });

});

function agregar(id, nombre, precio) {

    let item = carrito.find(p => p.id === id);

    if (item) {
        item.cantidad++;
    } else {
        carrito.push({id, nombre, precio, cantidad: 1});
    }

    render();
}

function render() {

    let cont = document.getElementById("carrito");
    cont.innerHTML = "";

    let total = 0;

    carrito.forEach((p, i) => {

        let subtotal = p.precio * p.cantidad;
        total += subtotal;

        cont.innerHTML += `
        <div class="carrito-item">
            ${p.nombre} x${p.cantidad}
            <span>$${subtotal}</span>
            <button onclick="quitar(${i})">X</button>
        </div>
        `;
    });

    document.getElementById("total").innerText = total.toFixed(2);
}

function quitar(i) {
    carrito.splice(i, 1);
    render();
}

function finalizar() {

    let data = {
        cliente: {
            nombre: document.getElementById("nombre").value,
            telefono: document.getElementById("telefono").value,
            direccion: document.getElementById("direccion").value
        },
        carrito: carrito
    };

    fetch("/finalizar_venta", {
        method: "POST",
        headers: {
            "Content-Type": "application/x-www-form-urlencoded"
        },
        body: "data=" + encodeURIComponent(JSON.stringify(data))
    })
    .then(r => r.json())
    .then(res => {
        alert("Venta realizada ✔");
        location.reload();
    });

}

</script>

</body>
</html>
