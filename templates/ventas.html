{% extends "base.html" %}
{% block content %}
<h1>🧾 Nueva Venta</h1>

<div class="card">
    <h3>👤 Cliente</h3>
    <input id="nombre" placeholder="Nombre del cliente">
    <input id="direccion" placeholder="Dirección">
    <input id="pagado" type="number" placeholder="¿Cuánto paga ahora?">
</div>

<div class="card">
    <h3>📦 Stock disponible</h3>
    <div id="productos_lista" style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;"></div>
</div>

<div class="card">
    <h3>🛒 Carrito</h3>
    <div id="carrito_lista"></div>
    <h2 style="text-align: right;">Total: $<span id="total_pago">0</span></h2>
    <button onclick="finalizar()" style="background: #22c55e;">COMPLETAR VENTA</button>
</div>

<script>
let carrito = [];

function cargarProductos() {
    fetch("/productos_json")
    .then(r => r.json())
    .then(data => {
        const div = document.getElementById("productos_lista");
        div.innerHTML = ""; 
        data.forEach(p => {
            div.innerHTML += `
            <div class="card" style="margin:0; padding:10px; font-size:13px;">
                <b>${p.nombre}</b><br>
                $${p.precio} | Stock: ${p.stock}<br>
                <button onclick="agregar(${p.id}, '${p.nombre}', ${p.precio}, ${p.stock})" 
                        style="padding:5px; margin-top:5px; font-size:11px;" 
                        ${p.stock <= 0 ? 'disabled style="background:gray"' : ''}>
                    ${p.stock <= 0 ? 'Agotado' : 'Añadir'}
                </button>
            </div>`;
        });
    });
}

function agregar(id, nombre, precio, stockMax) {
    let item = carrito.find(p => p.id === id);
    if(item) {
        if(item.cantidad < stockMax) item.cantidad++;
        else alert("Sin stock");
    } else {
        carrito.push({id, nombre, precio, cantidad: 1});
    }
    renderCarrito();
}

function renderCarrito() {
    const div = document.getElementById("carrito_lista");
    div.innerHTML = "";
    let total = 0;
    carrito.forEach((p, i) => {
        let sub = p.precio * p.cantidad;
        total += sub;
        div.innerHTML += `<div style="display:flex; justify-content:space-between; margin:5px 0;">
            <span>${p.nombre} x${p.cantidad}</span>
            <span>$${sub} <button class="red" onclick="quitar(${i})" style="width:30px; display:inline; padding:2px;">X</button></span>
        </div>`;
    });
    document.getElementById("total_pago").innerText = total.toFixed(2);
}

function quitar(i) { carrito.splice(i, 1); renderCarrito(); }

function finalizar() {
    if(carrito.length === 0) return alert("Carrito vacío");
    let data = {
        cliente: { nombre: document.getElementById("nombre").value || "Consumidor Final", direccion: document.getElementById("direccion").value || "N/C" },
        carrito: carrito,
        pagado: document.getElementById("pagado").value || 0
    };
    fetch("/finalizar_venta", {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: "data=" + encodeURIComponent(JSON.stringify(data))
    }).then(() => {
        alert("Venta exitosa");
        carrito = [];
        renderCarrito();
        cargarProductos(); // Actualiza stock visual
    });
}
cargarProductos();
</script>
{% endblock %}
