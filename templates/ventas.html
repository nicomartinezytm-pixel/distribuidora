{% extends "base.html" %}
{% block content %}
<h2>Nueva Venta</h2>
<div class="card">
    <input type="text" id="busqueda" placeholder="🔍 Buscar producto..." oninput="filtrar()">
    <div id="lista-prods" style="max-height: 150px; overflow-y: auto;"></div>
</div>

<div class="card">
    <h3>Carrito</h3>
    <div id="carrito-items" style="margin-bottom: 15px;"></div>
    
    <div style="background: #0f172a; padding: 15px; border-radius: 10px; margin-bottom: 15px;">
        <label>Datos del Cliente:</label>
        <input type="text" id="cliente" placeholder="Nombre completo">
        <input type="text" id="direccion" placeholder="Dirección de entrega">
        <input type="tel" id="whatsapp" placeholder="WhatsApp (ej: 351...)">
    </div>

    <button onclick="enviarVenta()" style="background: #22c55e; height: 70px; font-size: 20px;">
        CONFIRMAR VENTA ($<span id="total-v">0</span>)
    </button>
</div>

<script>
// ... (mismo script de filtrado anterior, pero actualizamos enviarVenta)
function enviarVenta() {
    const data = {
        cliente: {
            nombre: document.getElementById('cliente').value,
            direccion: document.getElementById('direccion').value,
            whatsapp: document.getElementById('whatsapp').value
        },
        carrito: carrito
    };
    if(!data.cliente.nombre || carrito.length === 0) return alert('Faltan datos');
    
    fetch('/finalizar_venta', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(data)
    }).then(() => window.location.href = '/boletas');
}
</script>
{% endblock %}
