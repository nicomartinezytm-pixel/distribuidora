{% extends "base.html" %}
{% block content %}
<style>
    .form-compra { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; background: #1e293b; }
    th, td { padding: 12px; text-align: left; border-bottom: 1px solid #334155; }
</style>

<h1>🏭 Panel de Abastecimiento</h1>
<div class="card">
    <h3>Registrar Compra</h3>
    <form action="/agregar_compra" method="POST">
        <div class="form-compra">
            <div style="grid-column: 1 / -1;">
                <label>Producto (Elegí o escribí uno nuevo):</label>
                <input list="prods" name="producto" placeholder="Escribí el nombre del producto..." required style="width: 100%;">
                <datalist id="prods">
                    {% for p in productos %}<option value="{{ p.nombre }}">{% endfor %}
                </datalist>
            </div>
            <input type="text" name="lugar" placeholder="Mayorista / Lugar" required>
            <input type="text" name="direccion" placeholder="Dirección">
            <input type="number" name="cantidad" placeholder="Cantidad" required>
            <input type="number" step="0.01" name="total" placeholder="Costo Total $" required>
        </div>
        <button type="submit" style="background: #3b82f6; width: 100%; margin-top: 15px; font-weight: bold;">Cargar Mercadería</button>
    </form>
</div>

<h2>Historial de Entradas</h2>
<table>
    <thead><tr><th>Fecha</th><th>Producto</th><th>Cant.</th><th>Costo</th><th>Lugar</th></tr></thead>
    <tbody>
        {% for c in historial %}
        <tr><td>{{ c.fecha }}</td><td><b>{{ c.producto }}</b></td><td>{{ c.cantidad }}</td><td>${{ c.total }}</td><td>{{ c.lugar }}</td></tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
