{% extends "base.html" %}
{% block content %}
<h1>🏭 Abastecimiento</h1>
<div class="card">
    <form action="/agregar_compra" method="POST">
        <label>Producto (Seleccioná o escribí nuevo):</label>
        <input list="prods" name="producto" placeholder="Nombre..." required style="width:100%; margin-bottom:10px;">
        <datalist id="prods">{% for p in productos %}<option value="{{ p.nombre }}">{% endfor %}</datalist>
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
            <input type="text" name="lugar" placeholder="Proveedor" required>
            <input type="text" name="direccion" placeholder="Dirección">
            <input type="number" name="cantidad" placeholder="Cantidad" required>
            <input type="number" step="0.01" name="total" placeholder="Costo Total $" required>
        </div>
        <button type="submit" style="background:#3b82f6; width:100%; margin-top:15px;">Registrar Compra</button>
    </form>
</div>
<table style="width:100%; margin-top:20px; border-collapse:collapse;">
    <thead style="background:#334155;"><tr><th style="padding:10px;">Fecha</th><th>Producto</th><th>Cant.</th><th>Total</th></tr></thead>
    <tbody>
        {% for c in historial %}
        <tr style="border-bottom:1px solid #334155;"><td style="padding:10px;">{{ c.fecha }}</td><td>{{ c.producto }}</td><td>{{ c.cantidad }}</td><td>${{ c.total }}</td></tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
