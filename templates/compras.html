{% extends "base.html" %}
{% block content %}
<h2>Registrar Compra</h2>
<div class="card">
    <form action="/agregar_compra" method="POST">
        <input type="text" name="lugar" placeholder="Proveedor / Lugar" required>
        <input list="prods" name="producto" placeholder="Producto" required>
        <datalist id="prods">
            {% for p in productos %}<option value="{{ p.nombre }}">{% endfor %}
        </datalist>
        <input type="number" name="cantidad" placeholder="Cantidad" required>
        <input type="number" step="0.01" name="total" placeholder="Costo Total $" required>
        <button type="submit">Guardar Compra</button>
    </form>
</div>

<h3>Historial</h3>
{% for c in historial %}
<div class="card" style="font-size: 14px;">
    <b>{{ c.producto }}</b> - {{ c.cantidad }} unidades<br>
    <small style="color:#94a3b8">Costo: ${{ c.total }} | {{ c.lugar }}</small>
</div>
{% endfor %}
{% endblock %}
