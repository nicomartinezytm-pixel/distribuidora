<!DOCTYPE html>
<html>
<head>
    <title>Distribuidora Pro</title>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

<h1>📦 Sistema Distribuidora Pro</h1>

<!-- ================= NAV ================= -->
<div class="nav">
    <a href="/dashboard"><button>📊 Dashboard</button></a>
    <a href="/vender"><button>🧾 Ventas</button></a>
    <a href="/clientes"><button>👥 Clientes</button></a>
    <a href="/boletas"><button>💳 Boletas</button></a>
</div>

<div class="container">

    <!-- ================= PRODUCTOS ================= -->
    <div class="card">
        <h2>➕ Nuevo Producto</h2>

        <form method="POST" action="/agregar_producto">

            <input name="nombre" placeholder="Nombre del producto">
            <input name="precio" placeholder="Precio">
            <input name="stock" placeholder="Stock inicial">

            <button>Guardar producto</button>

        </form>
    </div>

    <!-- ================= LISTA PRODUCTOS ================= -->
    <div class="card">
        <h2>📦 Productos</h2>

        {% for p in productos %}
        <div class="card">
            <b>{{p['nombre']}}</b><br>
            💰 Precio: ${{p['precio']}}<br>
            📦 Stock: {{p['stock']}}<br>

            <a href="/eliminar_producto/{{p['id']}}">
                <button>❌ Eliminar</button>
            </a>
        </div>
        {% endfor %}
    </div>

    <!-- ================= COMPRAS ================= -->
    <div class="card">
        <h2>🛒 Compras a Mayoristas</h2>

        <form method="POST" action="/agregar_compra">

            <input name="producto" placeholder="Producto (ej: Alfajores)">
            <input name="lugar" placeholder="Lugar de compra (ej: Carrefour)">
            <input name="cantidad" placeholder="Cantidad comprada">
            <input name="total" placeholder="Total pagado ($)">

            <button>➕ Registrar compra</button>

        </form>

        <p style="margin-top:10px;">
            📌 El sistema calcula automáticamente el precio unitario y suma stock.
        </p>
    </div>

</div>

</body>
</html>
