{% extends "base.html" %}
{% block content %}
<div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
    <h1 style="margin:0; font-size: 24px;">Stock</h1>
    <button onclick="abrirModal()" style="width: auto; padding: 10px 20px; margin: 0;">+ Nuevo</button>
</div>

<div id="lista-stock">
    {% for p in productos %}
    <div class="item-card">
        <div>
            <div style="font-weight: bold; font-size: 18px;">{{ p.nombre }}</div>
            <div style="color: var(--muted); font-size: 14px;">{{ p.unidad }} • <span style="color: var(--success)">${{ p.precio }}</span></div>
        </div>
        <div style="text-align: right;">
            <div style="font-size: 20px; font-weight: bold; color: {{ '#ef4444' if p.stock < 10 else '#22c55e' }}">
                {{ p.stock }}
            </div>
            <small style="color: var(--muted)">disponible</small>
        </div>
    </div>
    {% endfor %}
</div>

<!-- Modal de Nuevo Producto -->
<div id="modalProducto" class="modal">
    <div class="modal-content">
        <h2 style="margin-top: 0;">Nuevo Producto</h2>
        <form action="/agregar_producto" method="POST">
            <input type="text" name="nombre" placeholder="Nombre del producto" required>
            <div style="display: flex; gap: 10px;">
                <input type="number" step="0.01" name="precio" placeholder="Precio $" required>
                <input type="number" name="stock" placeholder="Stock inicial" required>
            </div>
            <select name="unidad">
                <option value="Unidad">Por Unidad</option>
                <option value="Kg">Por Kilo</option>
                <option value="Pack">Por Pack</option>
            </select>
            <input type="text" name="oferta" placeholder="Oferta (ej: 3x2)">
            <button type="submit">Guardar Producto</button>
            <button type="button" class="btn-close" onclick="cerrarModal()">Cancelar</button>
        </form>
    </div>
</div>

<script>
function abrirModal() { document.getElementById('modalProducto').style.display = 'block'; }
function cerrarModal() { document.getElementById('modalProducto').style.display = 'none'; }
// Cerrar si toca fuera del cuadro blanco
window.onclick = function(event) {
    if (event.target == document.getElementById('modalProducto')) cerrarModal();
}
</script>
{% endblock %}
