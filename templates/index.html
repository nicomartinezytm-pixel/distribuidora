{% extends "base.html" %}
{% block content %}

<div class="container">

    <h1>📦 Distribuidora Pro</h1>

    <!-- ================= PRODUCTO ================= -->
    <div class="card">
        <h3>➕ Agregar Producto</h3>

        <form method="POST" action="/agregar_producto">
            <input name="nombre" placeholder="Nombre" required>
            <input name="precio" placeholder="Precio" required>
            <input name="stock" placeholder="Stock" required>
            <button type="submit">Guardar</button>
        </form>
    </div>

    <!-- ================= LISTA ================= -->
    <div class="card">
        <h3>📦 Productos</h3>

        {% for p in productos %}
        <div class="card">
            <b>{{p['nombre']}}</b><br>
            💰 ${{p['precio']}}<br>
            📦 Stock: {{p['stock']}}<br>

            <a href="/eliminar_producto/{{p['id']}}">
                <button>❌ Eliminar</button>
            </a>
        </div>
        {% endfor %}
    </div>

    <!-- ================= COMPRAS ================= -->
    <div class="card">
        <h3>🛒 Compras Mayoristas</h3>

        <form method="POST" action="/agregar_compra">

            <input name="lugar" placeholder="Lugar (Carrefour, mayorista...)" required>
            <input name="producto" placeholder="Producto" required>
            <input name="cantidad" type="number" placeholder="Cantidad" required>
            <input name="total" type="number" step="0.01" placeholder="Total pagado" required>

            <button type="submit">Registrar compra</button>
        </form>

        <p style="font-size:13px;">
            📌 Esta compra se guarda y sirve para el control de gastos.
        </p>
    </div>

</div>

{% endblock %}
