<!DOCTYPE html>
<html>
<head>
    <title>Distribuidora</title>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

<h1>📦 Distribuidora App</h1>

<!-- ================= MENU PRINCIPAL ================= -->
<div style="margin-bottom:20px;">

    <a href="/vender"><button>🧾 Ventas</button></a>
    <a href="/dashboard"><button>📊 Dashboard</button></a>
    <a href="/boletas"><button>💳 Boletas</button></a>
    <a href="/clientes"><button>👥 Clientes</button></a>

</div>

<hr>

<!-- ================= AGREGAR PRODUCTO ================= -->
<h2>➕ Agregar Producto</h2>

<form method="POST" action="/agregar_producto">

    <input name="nombre" placeholder="Nombre" required>
    <input name="precio" placeholder="Precio" required>
    <input name="stock" placeholder="Stock" required>

    <br><br>

    <label>Tipo de producto:</label>
    <select name="tipo_precio" id="tipo" onchange="mostrarCampos()">

        <option value="unidad">Unidad</option>
        <option value="cantidad">Pack / Cantidad</option>
        <option value="oferta">Oferta</option>

    </select>

    <br><br>

    <!-- PACK -->
    <div id="campo-cantidad" style="display:none;">
        <input name="unidades" placeholder="Unidades por pack">
    </div>

    <!-- OFERTA -->
    <div id="campo-oferta" style="display:none;">
        <input name="oferta_unidades" placeholder="Unidades en oferta (ej: 3x2)">
    </div>

    <br>

    <button type="submit">Guardar producto</button>

</form>

<hr>

<!-- ================= LISTA PRODUCTOS ================= -->
<h2>📦 Productos</h2>

{% for p in productos %}
    <div style="border:1px solid #ccc; padding:10px; margin:5px;">

        <b>{{p['nombre']}}</b><br>
        💰 Precio: ${{p['precio']}}<br>
        📦 Stock: {{p['stock']}}<br>
        ⚙ Tipo: {{p['tipo_precio']}}<br>
        🔢 Unidades: {{p['unidades']}}<br>
        🎁 Oferta: {{p['oferta_unidades']}}

        <br><br>

        <a href="/eliminar_producto/{{p['id']}}">
            <button>❌ Eliminar</button>
        </a>

    </div>
{% endfor %}

<!-- ================= SCRIPT ================= -->
<script>
function mostrarCampos() {
    let tipo = document.getElementById("tipo").value;

    document.getElementById("campo-cantidad").style.display = "none";
    document.getElementById("campo-oferta").style.display = "none";

    if (tipo === "cantidad") {
        document.getElementById("campo-cantidad").style.display = "block";
    }

    if (tipo === "oferta") {
        document.getElementById("campo-oferta").style.display = "block";
    }
}
</script>

</body>
</html>
