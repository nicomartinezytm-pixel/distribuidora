{% extends "base.html" %}
{% block content %}
<div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
    <h2>Mi Inventario</h2>
    <button onclick="document.getElementById('modal').style.display='block'" style="width: auto; padding: 10px;">+ Nuevo</button>
</div>

{% for p in productos %}
<div class="card" style="display: flex; justify-content: space-between; align-items: center;">
    <div>
        <b style="font-size: 18px;">{{ p.nombre }}</b><br>
        <small style="color: #94a3b8;">{{ p.unidad }} • ${{ p.precio }}</small>
    </div>
    <div style="text-align: right;">
        <span style="font-size: 20px; font-weight: bold; color: {{ '#f87171' if p.stock < 5 else '#4ade80' }}">{{ p.stock }}</span>
    </div>
</div>
{% endfor %}

<div id="modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:1000;">
    <div class="card" style="margin: 20px; margin-top: 50px;">
        <h3>Nuevo Producto</h3>
        <form action="/agregar_producto" method="POST">
            <input type="text" name="nombre" placeholder="Nombre" required>
            <input type="number" step="0.01" name="precio" placeholder="Precio" required>
            <input type="number" name="stock" placeholder="Stock Inicial" required>
            <select name="unidad">
                <option value="Unidad">Unidad</option>
                <option value="Kilo">Kilo</option>
            </select>
            <input type="text" name="oferta" placeholder="Oferta (opcional)">
            <button type="submit">Guardar</button>
            <button type="button" onclick="document.getElementById('modal').style.display='none'" style="background:#475569;">Cerrar</button>
        </form>
    </div>
</div>
{% endblock %}
