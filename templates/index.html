<!DOCTYPE html>
<html>
<head>
    <title>Distribuidora</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            font-family: Arial;
            margin: 0;
            background: #f4f6f8;
        }

        h1 {
            text-align: center;
            margin: 20px;
        }

        .menu {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            padding: 15px;
        }

        .btn {
            background: white;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            text-decoration: none;
            color: black;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .btn:hover {
            background: #e9ecef;
        }

        .blue { border-left: 6px solid #0d6efd; }
        .green { border-left: 6px solid #198754; }
        .red { border-left: 6px solid #dc3545; }

    </style>
</head>

<body>

<h1>📦 Distribuidora PRO</h1>

<div class="menu">

    <a class="btn green" href="/vender">
        🛒 Ventas
    </a>

    <a class="btn blue" href="/dashboard">
        📊 Dashboard
    </a>

    <a class="btn red" href="/boletas">
        🧾 Boletas (Fiado)
    </a>

</div>

</body>
</html>
