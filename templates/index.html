{% extends "base.html" %}
{% block content %}

<div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
    <h1>Inventario</h1>
    <button onclick="document.getElementById('modal-agregar').style.display='flex'" style="width: auto; padding: 10px 20px;">+ Nuevo</button>
</div>

<div class="table-container card" style="padding: 0;">
    <table>
        <thead>
            <tr>
                <th>Producto</th>
                <th>Precio</th>
                <th>Stock</th>
                <th></th>
            </tr>
        </thead>
        <tbody>
            {% for p in productos %}
            <tr>
                <td><b>{{ p.nombre }}</b><br><small style="color: var(--text-muted)">{{ p.unidad }}</small></td>
                <td style="color: var(--success)">${{ p.precio }}</td>
                <td><span class="badge {% if p.stock < 5 %}fiado{% else %}pagado{% endif %}">{{ p.stock }}</span></td>
                <td>
                    <button onclick="abrirEditar('{{ p.id }}', '{{ p.nombre }}', '{{ p.precio }}', '{{ p.stock }}', '{{ p.unidad }}', '{{ p.oferta }}')" 
                            style="background: #475569; padding: 5px; width: 35px; margin: 0;">✏️</button>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>

<!-- Los modales se mantienen igual pero ahora se verán mejor por el CSS del base.html -->
{% endblock %}
