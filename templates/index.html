{% extends "base.html" %}

{% block content %}

<link rel="stylesheet" href="/static/style.css">

<script>
if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/static/service-worker.js')
}
</script>

<h1 style="text-align:center;">📦 Distribuidora</h1>

<div style="text-align:center; margin-bottom:15px;">
    <a href="/vender"><button>🧾 Ventas</button></a>
    <a href="/dashboard"><button>📊 Dashboard</button></a>
</div>

<div class="container">

<!-- AGREGAR PRODUCTO -->
<div class="card">
<h2>Agregar Producto</h2>

<form method="POST" action="/agregar_producto">

<input name="nombre" placeholder="Nombre" required>
<input name="precio" placeholder="Precio" required>
<input name="stock" placeholder="Stock" required>

<!-- TIPO -->
<select name="tipo_precio" id="tipo_precio" onchange="cambiarTipo()" required>
    <option value="unidad">Unidad</option>
    <option value="cantidad">Cantidad</option>
    <option value="oferta">Oferta</option>
</select>

<!-- SOLO PARA CANTIDAD -->
<div id="campo_cantidad" style="display:none;">
    <input name="cantidad_extra" placeholder="¿Cuántas unidades?">
</div>

<!-- SOLO PARA OFERTA -->
<div id="campo_oferta" style="display:none;">
    <input name="oferta_unidades" placeholder="Oferta: cuántas unidades incluye">
</div>

<button>Guardar</button>

</form>
</div>

<!-- PRODUCTOS -->
<div class="card">
<h2>Productos</h2>

{% for p in productos %}
<form method="POST" action="/editar_producto/{{p[0]}}">

<input name="nombre" value="{{p[1]}}">
<input name="precio" value="{{p[2]}}">
<input name="stock" value="{{p[3]}}">

<select name="tipo_precio">
    <option value="unidad" {% if p[4]=="unidad" %}selected{% endif %}>Unidad</option>
    <option value="cantidad" {% if p[4]=="cantidad" %}selected{% endif %}>Cantidad</option>
    <option value="oferta" {% if p[4]=="oferta" %}selected{% endif %}>Oferta</option>
</select>

<button>💾</button>
<a href="/eliminar_producto/{{p[0]}}">
<button type="button">❌</button>
</a>

</form>
{% endfor %}

</div>

</div>

<!-- JS DINÁMICO -->
<script>
function cambiarTipo() {
    let tipo = document.getElementById("tipo_precio").value;

    document.getElementById("campo_cantidad").style.display = "none";
    document.getElementById("campo_oferta").style.display = "none";

    if (tipo === "cantidad") {
        document.getElementById("campo_cantidad").style.display = "block";
    }

    if (tipo === "oferta") {
        document.getElementById("campo_oferta").style.display = "block";
    }
}
</script>

{% endblock %}
