{% extends "base.html" %}
{% block content %}

<div class="container">

<h1>📦 Distribuidora Pro</h1>

<!-- ================= PRODUCTO ================= -->
<div class="card">
<h3>➕ Nuevo Producto</h3>

<form method="POST" action="/agregar_producto">
<input name="nombre" placeholder="Nombre del producto">
<input name="precio" placeholder="Precio">
<input name="stock" placeholder="Stock inicial">
<button type="submit">Guardar producto</button>
</form>

</div>

<!-- ================= LISTA PRODUCTOS ================= -->
<div class="card">
<h3>📦 Productos</h3>

{% for p in productos %}
<div class="card">
<b>{{p['nombre']}}</b><br>
💰 Precio: ${{p['precio']}}<br>
📦 Stock: {{p['stock']}}<br>

<a href="/eliminar_producto/{{p['id']}}">
<button class="red">Eliminar</button>
</a>
</div>
{% endfor %}

</div>

<!-- ================= COMPRAS ================= -->
<div class="card">
<h3>🛒 Compras Mayoristas</h3>

<form method="POST" action="/agregar_compra">

<input name="lugar" placeholder="Lugar (Carrefour, mayorista...)">
<input name="producto" placeholder="Producto comprado">
<input name="cantidad" placeholder="Cantidad">

<input name="total" placeholder="Total pagado">

<button type="submit">Registrar compra</button>

</form>

<p style="font-size:12px;color:gray;margin-top:8px;">
✔ Esto suma stock automáticamente si el producto existe
</p>

</div>

</div>

{% endblock %}
