<!DOCTYPE html>
<html>
<head>
    <title>Dashboard Pro</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

<h1>📊 Dashboard Empresarial</h1>

<div class="container">

<div class="card">
    <h2>💰 Resumen</h2>
    <p>Ventas: ${{ total_ventas }}</p>
    <p>Compras: ${{ total_compras }}</p>
    <p>Ganancia total: ${{ ganancia }}</p>
</div>

<div class="card">
    <h2>📅 Mensual</h2>
    <p>Ventas mes: ${{ ventas_mes }}</p>
    <p>Compras mes: ${{ compras_mes }}</p>
    <h3>Ganancia mes: ${{ ganancia_mes }}</h3>
</div>

<div class="card">
    <h2>📊 Ventas vs Compras</h2>
    <canvas id="grafico"></canvas>
</div>

</div>

<script>
new Chart(document.getElementById("grafico"), {
    type: "bar",
    data: {
        labels: ["Ventas", "Compras", "Ganancia"],
        datasets: [{
            data: [{{ total_ventas }}, {{ total_compras }}, {{ ganancia }}]
        }]
    }
});
</script>

</body>
</html>
