<!DOCTYPE html>
<html>
<head>
    <title>Dashboard ERP</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

<h1>📊 Dashboard Empresa</h1>

<div>

<h2>💰 General</h2>
<p>Ventas: ${{ total_ventas }}</p>
<p>Compras: ${{ total_compras }}</p>
<p>Ganancia: ${{ ganancia }}</p>
<p>Margen: {{ margen|round(2) }}%</p>

<h2>📅 Mensual</h2>
<p>Ventas mes: ${{ ventas_mes }}</p>
<p>Compras mes: ${{ compras_mes }}</p>
<p>Ganancia mes: ${{ ganancia_mes }}</p>

</div>

<canvas id="grafico"></canvas>

<script>
new Chart(document.getElementById("grafico"), {
    type: "bar",
    data: {
        labels: ["Ventas", "Compras", "Ganancia"],
        datasets: [{
            data: [{{ total_ventas }}, {{ total_compras }}, {{ ganancia }}]
        }]
    }
});
</script>

</body>
</html>
