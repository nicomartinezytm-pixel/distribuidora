{% extends "base.html" %}
{% block content %}
<h1 style="font-size: 20px;">Resumen de Negocio</h1>
<div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
    <div class="card" style="text-align:center;">
        <small style="color:#94a3b8">Ventas</small>
        <div style="font-size: 20px; font-weight: bold; color: #22c55e;">${{ total_ventas }}</div>
    </div>
    <div class="card" style="text-align:center;">
        <small style="color:#94a3b8">Stock Bajo</small>
        <div style="font-size: 20px; font-weight: bold; color: #f59e0b;">{{ alertas_stock }}</div>
    </div>
</div>
<div class="card" style="text-align:center; border-left: 5px solid #3b82f6;">
    <small style="color:#94a3b8">Ganancia Estimada</small>
    <div style="font-size: 28px; font-weight: bold;">${{ ganancia }}</div>
</div>
{% endblock %}
