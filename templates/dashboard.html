<!DOCTYPE html>
<html>
<head>
    <title>Dashboard ERP</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

<{% extends "base.html" %}
{% block content %}

<h1>📊 Dashboard</h1>

<div class="card">
<h2>General</h2>
<p>Ventas: ${{ total_ventas or 0 }}</p>
<p>Compras: ${{ total_compras or 0 }}</p>
<p>Ganancia: ${{ ganancia or 0 }}</p>
</div>

<div class="card">
<h2>Mensual</h2>
<p>Ventas: ${{ ventas_mes or 0 }}</p>
<p>Compras: ${{ compras_mes or 0 }}</p>
<p>Ganancia: ${{ ganancia_mes or 0 }}</p>
</div>

{% endblock %}
