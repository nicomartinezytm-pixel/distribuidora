<!DOCTYPE html>
<html>
<head>
    <title>Dashboard</title>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

<h1>📊 Dashboard</h1>

<div class="nav">
    <a href="/"><button>🏠 Inicio</button></a>
</div>

<div class="container">

    <div class="card">
        <h2>💰 Total ventas</h2>
        <h1>${{total}}</h1>
    </div>

    <div class="card">
        <h2>🧾 Cantidad ventas</h2>
        <h1>{{ventas}}</h1>
    </div>

</div>

<div class="card">
    <h2>🏆 Mejores clientes</h2>

    {% for c in ranking %}
        <div class="card">
            {{c['nombre']}} - ${{c['total']}}
        </div>
    {% endfor %}
</div>

</body>
</html>
