<!DOCTYPE html>
<html>
<head>
    <title>Dashboard PRO</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            font-family: Arial;
            margin: 0;
            background: #f4f6f8;
        }

        h1 {
            text-align: center;
            margin: 20px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            padding: 10px;
        }

        .card {
            background: white;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .big {
            font-size: 22px;
            font-weight: bold;
        }

        .blue { color: #0d6efd; }
        .red { color: #dc3545; }
        .green { color: #198754; }

        .alert {
            background: #fff3cd;
            padding: 10px;
            margin: 10px;
            border-radius: 10px;
        }

        a {
            text-decoration: none;
            color: black;
        }

    </style>
</head>

<body>

<h1>📊 Dashboard PRO</h1>

<div class="grid">

    <div class="card">
        <div>Total ventas</div>
        <div class="big green">$ {{ total }}</div>
    </div>

    <div class="card">
        <div>Cantidad ventas</div>
        <div class="big blue">{{ ventas }}</div>
    </div>

    <div class="card">
        <div>Boletas pendientes</div>
        <div class="big red">{{ boletas_pendientes }}</div>
    </div>

    <div class="card">
        <div>Deuda total</div>
        <div class="big red">$ {{ deuda_total }}</div>
    </div>

</div>

<a href="/" style="display:block;text-align:center;margin:20px;">
    ⬅ Volver
</a>

</body>
</html>
